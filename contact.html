    <title>تواصل معنا | مصنع عوافي للصناعات الغذائية</title>
    <link rel="icon" type="image/x-icon" href="assets/images/awafi_icon.ico" />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 overflow-x-hidden">
    <header id="main-header"></header>

    <main>
      <!-- Hero Section -->
      <section
        class="bg-gray-950 py-10 flex items-center min-h-[500px]"
        aria-label="section hero contact"
      >
        <div class="container mx-auto px-6">
          <div
            class="flex flex-col md:flex-row items-center gap-12"
            id="hero-content"
          ></div>
        </div>
      </section>

      <!-- Contact Section -->
      <section
        id="contact-section"
        class="py-16 container mx-auto px-6 bg-gray-50"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">
          <!-- First Column (Right) - Contact Form -->
          <article
            class="bg-white p-8 rounded-3xl shadow-lg border border-gray-100"
            data-aos="fade-left"
          >
            <h2 class="text-2xl font-bold mb-6 text-gray-800">
              أرسل لنا استفسارك
            </h2>

            <form id="contactForm" class="space-y-5">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">
                  الاسم الكامل
                </label>
                <input
                  type="text"
                  id="name"
                  placeholder="اسم الشركة أو الفرد"
                  class="w-full p-3 bg-gray-50 rounded-xl outline-none border border-gray-200 focus:ring-2 focus:ring-[#cc0000] transition"
                />
                <span id="nameError" class="error-text">
                  يجب أن يكون الاسم 3 أحرف على الأقل
                </span>
              </div>

              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">
                  رقم الجوال
                </label>
                <input
                  type="tel"
                  id="phone"
                  placeholder="77XXXXXXX"
                  class="w-full p-3 bg-gray-50 rounded-xl outline-none border border-gray-200 focus:ring-2 focus:ring-[#cc0000] transition"
                />
                <span id="phoneError" class="error-text">
                  يرجى إدخال رقم هاتف يمني صحيح (9 أرقام)
                </span>
              </div>

              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">
                  رسالتك أو طلبك
                </label>
                <textarea
                  id="message"
                  placeholder="كيف يمكننا مساعدتك؟"
                  rows="4"
                  class="w-full p-3 bg-gray-50 rounded-xl outline-none border border-gray-200 focus:ring-2 focus:ring-[#cc0000] transition"
                ></textarea>
                <span id="messageError" class="error-text">
                  لا يمكن ترك خانة الرسالة فارغة
                </span>
              </div>

              <button
                type="submit"
                class="w-full bg-[#cc0000] text-white py-4 rounded-xl font-bold hover:bg-red-800 transition shadow-lg flex items-center justify-center gap-2"
                aria-label="إرسال رسالتك عبر واتساب"
              >
                <i
                  class="fab fa-whatsapp text-xl"
                  aria-label="أيقونة واتساب"
                ></i>
                إرسال عبر واتساب
              </button>
            </form>
          </article>

          <!-- Second Column (Left) - Factory Info + Map + Social Media Wrapper -->
          <div class="space-y-8" data-aos="fade-right">
            <!-- Factory Information -->
            <div>
              <h2 class="text-2xl font-bold mb-6 text-gray-800">
                معلومات المصنع الرسمي
              </h2>

              <!-- Address Card -->
              <article
                class="flex items-start gap-4 p-5 bg-white rounded-2xl shadow-sm border border-gray-50 mb-6"
              >
                <div
                  class="bg-red-50 p-3 rounded-xl text-[#cc0000]"
                  aria-hidden="true"
                >
                  <i
                    class="fas fa-map-marker-alt text-2xl"
                    aria-label="أيقونة الموقع الجغرافي"
                  ></i>
                </div>
                <div>
                  <h3 class="font-bold text-gray-800">العنوان</h3>
                  <p class="text-gray-600 text-sm">
                    صنعاء - شارع مأرب - تقاطع شارع مزدا
                  </p>
                </div>
              </article>

              <!-- Contact Numbers Card -->
              <article
                class="flex items-start gap-4 p-5 bg-white rounded-2xl shadow-sm border border-gray-50 hover:shadow-md transition"
              >
                <div
                  class="bg-red-50 p-3 rounded-xl text-[#cc0000]"
                  aria-hidden="true"
                >
                  <i
                    class="fas fa-phone-alt text-2xl"
                    aria-label="أيقونة الهاتف"
                  ></i>
                </div>
                <div>
                  <h3 class="font-bold text-gray-800 mb-2">أرقام التواصل</h3>
                  <div
                    class="flex flex-wrap items-center gap-3 text-gray-600 font-bold text-sm"
                    dir="ltr"
                  >
                    <a
                      href="tel:777245605"
                      class="hover:text-[#cc0000] transition"
                      title="اتصل على الرقم 777245605"
                      aria-label="اتصل على الرقم 777245605"
                      >777 245 605</a
                    >
                    <span class="text-gray-300 font-normal">|</span>
                    <a
                      href="tel:777792942"
                      class="hover:text-[#cc0000] transition"
                      title="اتصل على الرقم 777792942"
                      aria-label="اتصل على الرقم 777792942"
                      >777 792 942</a
                    >
                    <span class="text-gray-300 font-normal">|</span>
                    <a
                      href="tel:774747450"
                      class="hover:text-[#cc0000] transition"
                      title="اتصل على الرقم 774747450"
                      aria-label="اتصل على الرقم 774747450"
                      >774 747 450</a
                    >
                  </div>
                </div>
              </article>
            </div>

            <!-- Map Section -->
            <section
              class="w-full h-64 rounded-3xl overflow-hidden shadow-md border border-gray-200"
              aria-labelledby="map-heading"
            >
              <h3 id="map-heading" class="sr-only">خريطة موقع المصنع</h3>
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3846.9068536109315!2d44.2088889!3d15.3813889!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTXCsDIyJzUzLjAiTiA0NMKwMTInMzIuMCJF!5e0!3m2!1sen!2sye!4v1700000000000!5m2!1sen!2sye"
                class="w-full h-full border-0"
                title="خريطة موقع مصنع عوافي في صنعاء"
                allowfullscreen=""
                loading="lazy"
              ></iframe>
            </section>

            <!-- Social Media Section -->
            <section
              class="pt-6 border-t border-gray-200 text-center md:text-right"
              aria-labelledby="social-heading"
            >
              <h3 id="social-heading" class="font-bold text-gray-800 mb-4">
                تابعونا على:
              </h3>
              <div class="flex justify-center md:justify-start gap-4">
                <a
                  href="https://www.facebook.com/AWAFI2021/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="w-10 h-10 bg-[#1877F2] text-white rounded-full flex items-center justify-center hover:scale-110 transition shadow-md"
                  title="تابعنا على فيسبوك"
                  aria-label="تابعنا على فيسبوك"
                >
                  <i class="fab fa-facebook-f" aria-hidden="true"></i>
                </a>
                <a
                  href="https://www.instagram.com/awafi20232/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="w-10 h-10 bg-gradient-to-tr from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] text-white rounded-full flex items-center justify-center hover:scale-110 transition shadow-md"
                  title="تابعنا على انستغرام"
                  aria-label="تابعنا على انستغرام"
                >
                  <i class="fab fa-instagram" aria-hidden="true"></i>
                </a>
                <a
                  href="https://api.whatsapp.com/send?phone=967776360668"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="w-10 h-10 bg-[#25D366] text-white rounded-full flex items-center justify-center hover:scale-110 transition shadow-md"
                  title="تواصل معنا عبر واتساب"
                  aria-label="تواصل معنا عبر واتساب"
                >
                  <i class="fab fa-whatsapp" aria-hidden="true"></i>
                </a>
                <a
                  href="https://mail.google.com/mail/?view=cm&fs=1&to=info@awafi-ye.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="w-10 h-10 bg-[#cc0000] text-white rounded-full flex items-center justify-center hover:scale-110 transition shadow-md"
                  title="راسلنا عبر البريد الإلكتروني"
                  aria-label="راسلنا عبر البريد الإلكتروني"
                >
                  <i class="fas fa-envelope" aria-hidden="true"></i>
                </a>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/contact-logic.js"></script>
    <script src="assets/js/products.js"></script>
    <script>
      AOS.init({ duration: 1000, once: true });
    </script>
    <script>
      // إعداد بيانات صفحة التواصل لتمريرها للمحرك الموحد
      const pageConfig = {
        title: `<span class="text-white">يسعدنا التواصل معكم في <span style="color:#cc0000">عوافي</span></span>`,
        description:
          "نحن هنا للإجابة على استفساراتكم وتلبية طلباتكم بأعلى معايير الجودة. سواء كنت تاجراً أو مندوباً، بابنا مفتوح دائماً للنجاح.",
        image: "", // اتركها فارغة إذا أردت النص في المنتصف، أو ضع رابط صورة اللوجو
        extraHTML: `
      <div class="mt-8 animate-pulse text-white/50 text-sm cursor-pointer hover:text-white/70 transition-colors" onclick="document.getElementById('contact-section').scrollIntoView({behavior: 'smooth', block: 'start'})" title="انتقل لطرق التواصل" aria-label="انتقل لطرق التواصل">
          <i class="fas fa-arrow-down ml-2"></i> استعرض طرق التواصل أدناه
      </div>`,
      };

      // استدعاء المحرك الموحد عند تحميل الصفحة
      document.addEventListener("DOMContentLoaded", () =>
        initProductsPage(pageConfig),
      );
    </script>
  </body>
</html>
